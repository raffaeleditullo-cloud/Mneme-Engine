<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140b24" />
      <stop offset="70%" stop-color="#08040f" />
      <stop offset="100%" stop-color="#020105" />
    </radialGradient>

    <!-- Metallic Ring Gradient -->
    <linearGradient id="metal-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b3b4f" />
      <stop offset="25%" stop-color="#1e1e28" />
      <stop offset="50%" stop-color="#62627a" />
      <stop offset="75%" stop-color="#181822" />
      <stop offset="100%" stop-color="#2d2d3a" />
    </linearGradient>

    <!-- Gold Geodesic Gradient -->
    <linearGradient id="gold-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a" />
      <stop offset="50%" stop-color="#ffb830" />
      <stop offset="100%" stop-color="#e08500" />
    </linearGradient>

    <!-- Violet Invariant Glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#e288ff" />
      <stop offset="50%" stop-color="#8a2be2" />
      <stop offset="80%" stop-color="#3b0078" />
      <stop offset="100%" stop-color="#12002b" stop-opacity="0" />
    </radialGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" rx="40" fill="url(#bg-grad)" />

  <!-- Outer Armored Bezel -->
  <circle cx="400" cy="400" r="350" fill="none" stroke="url(#metal-frame)" stroke-width="26" />
  <circle cx="400" cy="400" r="335" fill="none" stroke="#ffb830" stroke-width="2" opacity="0.6" stroke-dasharray="12, 6" />
  <circle cx="400" cy="400" r="315" fill="none" stroke="#2a1f45" stroke-width="4" />

  <!-- Ricci Flow Curvature Grid Lines -->
  <g opacity="0.25" stroke="#9d4edd" stroke-width="1.2">
    <ellipse cx="400" cy="400" rx="290" ry="180" fill="none" transform="rotate(15 400 400)" />
    <ellipse cx="400" cy="400" rx="290" ry="180" fill="none" transform="rotate(45 400 400)" />
    <ellipse cx="400" cy="400" rx="290" ry="180" fill="none" transform="rotate(75 400 400)" />
    <ellipse cx="400" cy="400" rx="290" ry="180" fill="none" transform="rotate(105 400 400)" />
    <ellipse cx="400" cy="400" rx="290" ry="180" fill="none" transform="rotate(135 400 400)" />
    <ellipse cx="400" cy="400" rx="290" ry="180" fill="none" transform="rotate(165 400 400)" />
  </g>

  <!-- Golden Geodesic Dodecahedral Manifold Outer Ring -->
  <circle cx="400" cy="400" r="230" fill="none" stroke="url(#gold-neon)" stroke-width="4" filter="url(#neon-glow)" />
  <circle cx="400" cy="400" r="170" fill="none" stroke="url(#gold-neon)" stroke-width="3" opacity="0.8" />

  <!-- Geodesic Facets -->
  <g stroke="url(#gold-neon)" stroke-width="2" fill="#5a189a" fill-opacity="0.2" filter="url(#neon-glow)">
    <!-- 12-gon outer triangles -->
    <polygon points="400,170 450,230 400,230" />
    <polygon points="450,230 515,285 470,270" />
    <polygon points="515,285 570,350 515,350" />
    <polygon points="570,350 630,400 570,450" />
    <polygon points="570,450 515,515 470,530" />
    <polygon points="515,515 450,570 400,570" />
    <polygon points="400,570 350,570 400,515" />
    <polygon points="350,570 285,515 330,530" />
    <polygon points="285,515 230,450 285,450" />
    <polygon points="230,450 170,400 230,350" />
    <polygon points="230,350 285,285 330,270" />
    <polygon points="285,285 350,230 400,230" />
  </g>

  <!-- Lyapunov Contractive Vortex (Asymptotic Sinks) -->
  <g stroke="#ffd166" stroke-width="1.8" opacity="0.85" fill="none">
    <path d="M400,280 Q470,320 400,400" />
    <path d="M485,315 Q520,385 400,400" />
    <path d="M520,400 Q485,485 400,400" />
    <path d="M485,485 Q400,520 400,400" />
    <path d="M400,520 Q315,485 400,400" />
    <path d="M315,485 Q280,400 400,400" />
    <path d="M280,400 Q315,315 400,400" />
    <path d="M315,315 Q400,280 400,400" />
  </g>

  <!-- Invariant Equilibrium Attractor Singularity -->
  <circle cx="400" cy="400" r="110" fill="url(#core-glow)" />
  <circle cx="400" cy="400" r="35" fill="#ffffff" filter="url(#neon-glow)" />
  <circle cx="400" cy="400" r="12" fill="#ffe27a" />

  <!-- Center Ray Flare -->
  <line x1="400" y1="360" x2="400" y2="440" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <line x1="360" y1="400" x2="440" y2="400" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <!-- Typography -->
  <text x="400" y="695" text-anchor="middle" font-family="'Orbitron', 'Segoe UI', 'Montserrat', sans-serif" font-size="34" font-weight="900" letter-spacing="9" fill="#e0e1dd">
    MNEME ENGINE
  </text>
  <text x="400" y="730" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="600" letter-spacing="5" fill="#ffb830">
    LYAPUNOV STABILITY · RICCI CURVATURE FLOW
  </text>
</svg>
